<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow" />
    <style>
        body {
            background-color: rgba(23, 23, 23, 1);
        }
        .setup-hidden { display: none !important; }
    </style>
    <link rel="preload" as="style" href="style.css">
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="css/st-tailwind.css">
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/user.css" rel="stylesheet">
    <title>EmberDesk - 初始设置</title>
</head>

<body class="login">
    <main class="login-page" role="main">
        <section class="login-card" id="setupCard" aria-labelledby="setup-title">
            <header class="login-header">
                <img src="img/logo.png" alt="" class="login-logo">
                <h1 id="setup-title">初始设置</h1>
            </header>

            <form id="setupForm" novalidate>
                <div class="login-field" id="handleField">
                    <label for="handle">用户名</label>
                    <input id="handle" type="text" autocomplete="username"
                           placeholder="请输入用户名" required aria-required="true">
                </div>

                <div class="login-field" id="nameField">
                    <label for="name">显示名称 <span style="opacity:0.5;font-size:0.8em">（可选）</span></label>
                    <input id="name" type="text" autocomplete="name"
                           placeholder="留空则使用用户名">
                </div>

                <div class="login-field login-field--password">
                    <label for="password" id="passwordLabel">密码</label>
                    <div class="login-input-wrap">
                        <input id="password" type="password" autocomplete="new-password"
                               placeholder="请输入密码" required aria-required="true">
                        <button type="button" class="password-toggle" id="passwordToggle"
                                aria-label="显示密码" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-field login-field--password">
                    <label for="confirmPassword">确认密码</label>
                    <div class="login-input-wrap">
                        <input id="confirmPassword" type="password" autocomplete="new-password"
                               placeholder="请再次输入密码" required aria-required="true">
                        <button type="button" class="password-toggle" id="confirmPasswordToggle"
                                aria-label="显示密码" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="setupButton">创建管理员账户</button>
            </form>

            <div class="login-error" id="errorMessage" role="alert" aria-live="polite"></div>
        </section>
    </main>

    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/setup.js" type="module"></script>
</body>

</html>
