<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow" />
    <style>
        body {
            background-color: rgba(23, 23, 23, 1);
        }
    </style>
    <link rel="preload" as="style" href="style.css">
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="css/st-tailwind.css">
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/user.css" rel="stylesheet">
    <title>EmberDesk</title>
</head>

<body class="login">
    <main class="login-page" role="main">
        <!-- Login form -->
        <section class="login-card" id="loginCard" aria-labelledby="login-title">
            <header class="login-header">
                <img src="img/logo.png" alt="" class="login-logo">
                <h1 id="login-title">EmberDesk</h1>
            </header>

            <form id="loginForm" novalidate>
                <div class="login-field" id="handleField">
                    <label for="handle">Handle</label>
                    <input id="handle" type="text" autocomplete="username"
                           placeholder="your-handle" required aria-required="true">
                </div>

                <div class="login-field login-field--password" id="passwordField">
                    <label for="password">Password</label>
                    <div class="login-input-wrap">
                        <input id="password" type="password" autocomplete="current-password"
                               placeholder="Password">
                        <button type="button" class="password-toggle" id="passwordToggle"
                                aria-label="Show password" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginButton">Sign in</button>
            </form>

            <div class="login-error" id="errorMessage" role="alert" aria-live="polite"></div>

            <a href="#" class="login-forgot" id="forgotLink">Forgot password?</a>
        </section>

        <!-- Recovery form (hidden by default) -->
        <section class="login-card" id="recoveryCard" style="display:none" aria-labelledby="recovery-title">
            <header class="login-header">
                <img src="img/logo.png" alt="" class="login-logo">
                <h1 id="recovery-title">Reset Password</h1>
            </header>

            <form id="recoveryForm" novalidate>
                <div class="login-field">
                    <label for="recoverHandle">Handle</label>
                    <input id="recoverHandle" type="text" autocomplete="username"
                           placeholder="your-handle" required>
                </div>

                <div id="recoveryStep1">
                    <button type="submit" class="login-btn" id="sendCodeBtn">Send recovery code</button>
                </div>

                <div id="recoveryStep2" style="display:none">
                    <div class="login-field">
                        <label for="recoveryCode">Recovery code</label>
                        <input id="recoveryCode" type="text" inputmode="numeric"
                               placeholder="000000" maxlength="6">
                    </div>
                    <div class="login-field">
                        <label for="newPassword">New password</label>
                        <input id="newPassword" type="password" autocomplete="new-password"
                               placeholder="New password">
                    </div>
                    <button type="submit" class="login-btn" id="resetBtn">Reset password</button>
                </div>
            </form>

            <div class="login-error" id="recoveryError" role="alert" aria-live="polite"></div>

            <a href="#" class="login-forgot" id="cancelRecovery">Back to sign in</a>
        </section>
    </main>

    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/login.js" type="module"></script>
</body>

</html>
