<div class="{{prefix}}prompt_manager_footer">
    <select id="{{prefix}}prompt_manager_footer_append_prompt" class="text_pole" name="append-prompt">
        {{{promptsHtml}}}
    </select>
    <a class="menu_button pm-toolbar-btn" id="prompt-manager-append-prompt" title="Insert prompt" data-i18n="[title]Insert prompt"><i class="fa-chain fa-solid fa-fw"></i><span class="pm-btn-label" data-i18n="Insert">Insert</span></a>
    <a class="caution menu_button pm-toolbar-btn pm-danger-ghost" id="prompt-manager-delete-prompt" title="Delete prompt" data-i18n="[title]Delete prompt"><i class="fa-x fa-solid fa-fw"></i><span class="pm-btn-label" data-i18n="Delete">Delete</span></a>
    <span class="pm-toolbar-sep"></span>
    <div class="pm-footer-menu">
        <a class="menu_button pm-toolbar-btn" id="prompt-manager-more" title="More prompt list actions" data-i18n="[title]More prompt list actions" aria-haspopup="menu" aria-expanded="false"><i class="fa-ellipsis-vertical fa-solid fa-fw"></i><span class="pm-btn-label" data-i18n="More">More</span></a>
        <div class="pm-overflow-menu" role="menu">
            <a class="menu_button pm-overflow-item" id="prompt-manager-import" role="menuitem" title="Import a prompt list" data-i18n="[title]Import a prompt list"><i class="fa-file-import fa-solid fa-fw"></i><span data-i18n="Import">Import</span></a>
            <a class="menu_button pm-overflow-item" id="prompt-manager-export" role="menuitem" title="Export this prompt list" data-i18n="[title]Export this prompt list"><i class="fa-file-export fa-solid fa-fw"></i><span data-i18n="Export">Export</span></a>
            <a class="menu_button pm-overflow-item" id="prompt-manager-reset-character" role="menuitem" title="Reset current character" data-i18n="[title]Reset current character"><i class="fa-undo fa-solid fa-fw"></i><span data-i18n="Reset">Reset</span></a>
        </div>
    </div>
    <a class="menu_button pm-primary-btn" id="prompt-manager-new-prompt" title="New prompt" data-i18n="[title]New prompt"><i class="fa-plus-square fa-solid fa-fw"></i><span data-i18n="New">New</span></a>
</div>
