<div class="range-block">
    {{#if error}}
        {{{errorDiv}}}
    {{/if}}
    <div class="{{prefix}}prompt_manager_header">
        <div class="{{prefix}}prompt_manager_header_advanced">
            <span data-i18n="Prompts">Prompts</span>
        </div>
        <div class="pm-header-meta">
            {{#if promptCounts}}
            <span class="pm-count-badge" title="Enabled / listed prompts" data-i18n="[title]Enabled / listed prompts"><i class="fa-solid fa-list-check fa-fw"></i>{{promptCounts}}</span>
            {{/if}}
            <div class="pm-token-badge"><span class="pm-token-value">{{totalActiveTokens}}</span><span>tok</span></div>
        </div>
    </div>
    <ul id="{{prefix}}prompt_manager_list" class="text_pole"></ul>
</div>
