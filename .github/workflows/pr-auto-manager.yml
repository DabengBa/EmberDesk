name: 🔀 Pull Request Manager

on:
  workflow_dispatch: # Allow to manually call this workflow
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  label-by-size:
    name: 🏷️ Label PR by Size
    # This job should run after all others, to prevent possible concurrency issues
    needs: [label-by-branches, label-by-files, label-copilot-prs, remove-stale-label, check-merge-blocking-labels, write-auto-comments]
    runs-on: ubuntu-latest
    # Only needs to run when code is changed
    if: always() && (github.event.action == 'opened' || github.event.action == 'synchronize')

    permissions:
      pull-requests: write

    steps:

      - name: Label PR Size
        # Pull Request Size Labeler
        # https://github.com/marketplace/actions/pull-request-size-labeler
        uses: codelytv/pr-size-labeler@4ec67706cd878fbc1c8db0a5dcd28b6bb412e85a # v1.10.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          xs_label: '🟩 ⬤○○○○'
          xs_max_size: '20'
          s_label: '🟩 ⬤⬤○○○'
          s_max_size: '100'
          m_label: '🟨 ⬤⬤⬤○○'
          m_max_size: '500'
          l_label: '🟧 ⬤⬤⬤⬤○'
          l_max_size: '1000'
          xl_label: '🟥 ⬤⬤⬤⬤⬤'
          fail_if_xl: 'false'
          files_to_ignore: |
            "package-lock.json"
            "public/lib/*"

  label-by-branches:
    permissions:
      contents: read
      pull-requests: write
    name: 🏷️ Label PR by Branches
    runs-on: ubuntu-latest
    # Only label once when PR is created or when base branch is changed, to allow manual label removal
    if: always() && (github.event.action == 'opened' || (github.event.action == 'synchronize' && github.event.changes.base))

    steps:

      - name: Checkout Repository
        # Checkout
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Apply Labels Based on Branch Name and Target Branch
        # Pull Request Labeler
        # https://github.com/marketplace/actions/labeler
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          configuration-path: .github/pr-auto-labels-by-branch.yml
          repo-token: ${{ github.token }}

  label-by-files:
    permissions:
      contents: read
      pull-requests: write
    name: 🏷️ Label PR by Files
    needs: [label-by-branches]
    runs-on: ubuntu-latest
    # Only needs to run when code is changed
    if: always() && (github.event.action == 'opened' || github.event.action == 'synchronize')

    steps:

      - name: Checkout Repository
        # Checkout
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Apply Labels Based on Changed Files
        # Pull Request Labeler
        # https://github.com/marketplace/actions/labeler
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }} # labeler action needs some handholding
        with:
          configuration-path: .github/pr-auto-labels-by-files.yml
          repo-token: ${{ github.token }}

  label-copilot-prs:
    permissions:
      pull-requests: write
    name: 🏷️ Label Copilot PRs as Vibe Coded
    runs-on: ubuntu-latest
    # Only label once when PR is created by Copilot
    if: >
      github.event.action == 'opened' &&
      github.event.pull_request.user.login == 'Copilot'

    steps:

      - name: Add Vibe Coded Label
        # 🤖 Issues Helper
        # https://github.com/marketplace/actions/issues-helper
        uses: actions-cool/issues-helper@a610082f8ac0cf03e357eb8dd0d5e2ba075e017e # v3.6.0
        with:
          actions: 'add-labels'
          token: ${{ github.token }}
          issue-number: ${{ github.event.pull_request.number }}
          labels: '✨ Vibe Coded'

  remove-stale-label:
    name: 🗑️ Remove Stale Label on Comment
    needs: [label-by-branches, label-by-files, label-copilot-prs]
    runs-on: ubuntu-latest
    # Only runs on comments not done by the github actions bot
    if: always() && (github.event_name == 'pull_request_review_comment' && github.event.sender.type != 'Bot')

    permissions:
      pull-requests: write

    steps:

      - name: Remove Stale Label
        if: always()
        # 🤖 Issues Helper
        # https://github.com/marketplace/actions/issues-helper
        uses: actions-cool/issues-helper@a610082f8ac0cf03e357eb8dd0d5e2ba075e017e # v3.6.0
        with:
          actions: 'remove-labels'
          token: ${{ github.token }}
          issue-number: ${{ github.event.pull_request.number }}
          labels: '⚰️ Stale'

  check-merge-blocking-labels:
    name: 🚫 Check Merge Blocking Labels
    needs: [label-by-branches, label-by-files, label-copilot-prs, remove-stale-label]
    runs-on: ubuntu-latest
    # Run, even if the previous jobs were skipped/failed
    if: always()

    # Override permissions, as this needs to write a check
    permissions:
      checks: write

    steps:
      - name: Check Merge Blocking
        # GitHub Script
        # https://github.com/marketplace/actions/github-script
        id: label-check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const prLabels = pullRequest.labels.map(label => label.name);
            const blockingLabels = [
              "⛔ Don't Merge",
              "🔨 Needs Work",
              "🔬 Needs Testing",
              "⛔ Waiting For External/Upstream",
              "❗ Against Release Branch",
              "💥💣 Breaking Changes"
            ];
            const hasBlockingLabel = prLabels.some(label => blockingLabels.includes(label));

            if (hasBlockingLabel) {
              console.log("Blocking label detected. Setting warning status.");
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "PR Label Warning",
                head_sha: context.payload.pull_request.head.sha,
                status: "completed",
                conclusion: "neutral",
                output: {
                  title: "Potential Merge Issue",
                  summary: "This PR has a merge-blocking label. Proceed with caution."
                }
              });
            } else {
              console.log("No merge-blocking labels found.");
            }

  write-auto-comments:
    permissions:
      contents: read
      pull-requests: write
    name: 💬 Post PR Comments Based on Labels
    needs: [label-by-branches, label-by-files, label-copilot-prs, remove-stale-label, check-merge-blocking-labels]
    runs-on: ubuntu-latest
    # Run, even if the previous jobs were skipped/failed
    if: always() && (github.event_name == 'pull_request_target')

    steps:

      - name: Checkout Repository
        # Checkout
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Post PR Comments Based on Labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const labels = pullRequest.labels.map(label => label.name);
            if (labels.includes("✖️ Invalid")) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body: `Hey @${pullRequest.user.login}, thanks for your contribution! Unfortunately, this PR has been marked as invalid.\n\nPlease check that you've followed the PR template, included all relevant details, and are targeting the correct branch (\`staging\` for regular contributions, \`release\` only for hotfixes).\n\nIf you need help, feel free to ask!`
              });
              return;
            }
            const comments = {
              "⛔ Don't Merge": "🚨 This PR has been temporarily blocked from merging.",
              "💥💣 Breaking Changes": "⚠️ Heads up! This PR introduces breaking changes.\n\nMake sure these changes are well-documented and that users will be properly informed when this is released.",
              "⛔ Waiting For External/Upstream": "⛔ This PR is awaiting external or upstream changes or approval. It can only be merged once those changes have been implemented and approved.\n\nPlease inform us of any progress on the upstream changes or approval.",
              "🔬 Needs Testing": "🔬 This PR needs testing! Any contributor can test and leave reviews, so feel free to help out!",
              "❗ Against Release Branch": "❗ This PR is against the `release` branch.\n\nPlease make sure this was intended, and you did not want to target the `staging` branch. Only hotfixes, readme changes and similar should be made against `release`.\n\nYou can change the target branch without recreating the PR by clicking **Edit** at the top of the page.",
              "🟥 ⬤⬤⬤⬤⬤": "⚠️ This PR is over 1000 lines, which is larger than recommended.\n\nPlease make sure that it only addresses a single issue; PRs this large are hard to test and may be rejected."
            };
            for (const [label, body] of Object.entries(comments)) {
              if (!labels.includes(label)) continue;
              const { data: issueComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number
              });
              if (issueComments.some(comment => comment.user.type === "Bot" && comment.body === body)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body
              });
            }

  # This runs on merged PRs to staging, reading the PR body and directly linked issues. Check `issues-updates-on-merge.yml`:`update-linked-issues` for commit-based updates.
  update-linked-issues:
    name: 🔗 Mark Linked Issues Done on Staging Merge
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'staging'

    # Override permissions, We need to be able to write to issues
    permissions:
      issues: write
      pull-requests: read

    steps:

      - name: Extract Linked Issues From PR Description
        id: extract_issues
        run: |
            ISSUES=$(jq -r '.pull_request.body' "$GITHUB_EVENT_PATH" | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #([0-9]+)' | awk '{print $2}' | tr -d '#' | jq -R -s -c 'split("\n")[:-1]')
            echo "issues=$ISSUES" >> $GITHUB_ENV

      - name: Fetch Directly Linked Issues
        id: fetch_linked_issues
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          API_URL="https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/issues"
          ISSUES=$(curl -s -H "Authorization: token ${{ github.token }}" "$API_URL" | jq -r '.[].number' | jq -R -s -c 'split("\n")[:-1]')
          echo "linked_issues=$ISSUES" >> $GITHUB_ENV

      - name: Merge Issue Lists
        id: merge_issues
        run: |
          ISSUES=$(jq -c -n --argjson a "$issues" --argjson b "$linked_issues" '$a + $b | unique')
          echo "final_issues=$ISSUES" >> $GITHUB_ENV

      - name: Label Linked Issues
        id: label_linked_issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ISSUE in $(echo $final_issues | jq -r '.[]'); do
            gh issue edit $ISSUE -R ${{ github.repository }} --add-label "✅ Done (staging)" --remove-label "🧑‍💻 In Progress"
            echo "Added label '✅ Done (staging)' (and removed '🧑‍💻 In Progress' if present) in issue #$ISSUE"
          done
